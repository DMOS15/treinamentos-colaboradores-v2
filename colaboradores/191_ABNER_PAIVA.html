<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Teste JSON</title>
</head>

<body>

<h1>Teste SHE Nexus JSON</h1>

<div id="resultado"></div>

<script>

fetch('../dados.json')
.then(response => response.json())
.then(dados => {

    const colaborador = dados.filter(
    x => x.IDFIXO === "191"
);

const info = colaborador[0];

document.getElementById("resultado").innerHTML = `
    <h2>${info.COLABORADOR_EXIBICAO}</h2>

    <p>
        <b>Cargo:</b> ${info.CARGO}
    </p>

    <p>
        <b>Área:</b> ${info.AREA}
    </p>

    <p>
        <b>Coordenador:</b> ${info.COORDENADOR}
    </p>

    <hr>

    <h3>Treinamentos</h3>;

});

</script>

</body>

</html>
