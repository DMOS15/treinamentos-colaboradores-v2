<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Teste JSON</title>
</head>

<body>

<h1>Teste SHE Nexus JSON</h1>

<div id="resultado"></div>

<script>

fetch('../dados.json')
.then(response => response.json())
.then(dados => {

    const colaborador = dados.filter(
        x => x.IDFIXO === "191"
    );

    document.getElementById("resultado").innerHTML =
        "<pre>" +
        JSON.stringify(colaborador, null, 2) +
        "</pre>";

});

</script>

</body>

</html>
