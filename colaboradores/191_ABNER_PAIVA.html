<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SHE Nexus V2</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.info-item{
    display:flex;
    flex-direction:column;
}

.info-item span{
    font-size:11px;
    text-transform:uppercase;
    color:#8b7355;
    font-weight:700;
    margin-bottom:5px;
}

.info-item strong{
    font-size:15px;
    color:#2b1d13;
}
.section{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#3b2a1d;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.badge{
    padding:4px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.ok{
    background:#c8e6d9;
    color:#1e6f3f;
}

.vencido{
    background:#f5d1d1;
    color:#b32d2d;
}

.pendente{
    background:#fff3cd;
    color:#856404;
}

</style>

</head>

<body>

<div id="resultado"></div>

<script>

fetch('../dados.json')

.then(response => response.json())

.then(dados => {

    const arquivo = window.location.pathname
    .split('/')
    .pop();

const idfixo = arquivo.split('_')[0];

const colaborador = dados.filter(
    x => x.IDFIXO === idfixo
);
    
const quantidadeTreinamentos = colaborador.length;
    
    const info = colaborador[0];

    let obrigatoriosHTML = "";

    let normativosHTML = "";

    colaborador.forEach(item => {

        let classeStatus = "";

        if(item.STATUS === "NO PRAZO"){
            classeStatus = "ok";
        }

        else if(item.STATUS === "VENCIDO"){
            classeStatus = "vencido";
        }

        else{
            classeStatus = "pendente";
        }

        const linha = `
            <tr>
                <td>${item.TREINAMENTO}</td>
                <td>${item.TREINADO_EM}</td>
                <td>${item.VENCE_EM}</td>
                <td>
                    <span class="badge ${classeStatus}">
                        ${item.STATUS}
                    </span>
                </td>
            </tr>
        `;

        if(item.TIPO_TREINAMENTO === "NORM"){

            normativosHTML += linha;

        } else {

            obrigatoriosHTML += linha;

        }

    });

    document.getElementById("resultado").innerHTML = `

    <div class="card">

    <div class="info-grid">

        <div class="info-item">
            <span>Nome</span>
            <strong>${info.COLABORADOR_EXIBICAO}</strong>
            <div style="
    margin-top:8px;
    color:#8b7355;
    font-size:13px;
    font-weight:600;
">
    ${quantidadeTreinamentos} treinamentos encontrados
</div>
        </div>

        

        <div class="info-item">
            <span>Cargo</span>
            <strong>${info.CARGO}</strong>
        </div>

        <div class="info-item">
            <span>Área</span>
            <strong>${info.AREA}</strong>
        </div>

        <div class="info-item">
            <span>Coordenador</span>
            <strong>${info.COORDENADOR}</strong>
        </div>
        
        <div class="info-item">
    <span>Última Atualização</span>
    <strong>${info.ULTIMA_ATUALIZACAO_FORMATADA}</strong>
</div>

    </div>

</div>

    <div class="section">

        <h2>📚 Treinamentos Normativos</h2>

        <table>

            <thead>

                <tr>

                    <th>Treinamento</th>
                    <th>Treinado em</th>
                    <th>Vence em</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                ${normativosHTML}

            </tbody>

        </table>

    </div>

    <div class="section">

        <h2>📌 Treinamentos Obrigatórios</h2>

        <table>

            <thead>

                <tr>

                    <th>Treinamento</th>
                    <th>Treinado em</th>
                    <th>Vence em</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                ${obrigatoriosHTML}

            </tbody>

        </table>

    </div>

    `;

});

</script>

</body>

</html>
