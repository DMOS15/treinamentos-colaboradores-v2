<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SHE Nexus V2</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#f5efe6;
}
    .header{
    background:linear-gradient(
        90deg,
        #2b1d13,
        #4a3021
    );

    color:white;

    padding:20px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header a{
    color:#ffd6a8;
    text-decoration:none;
    font-size:14px;
}


.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}
    
#resultado{
    padding:25px;
}

.info-item{
    display:flex;
    flex-direction:column;
}

.info-item span{
    font-size:11px;
    text-transform:uppercase;
    color:#8b7355;
    font-weight:700;
    margin-bottom:5px;
}

.info-item strong{
    font-size:15px;
    color:#2b1d13;
}
.section{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#3b2a1d;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.badge{
    padding:4px 10px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
}

.ok{
    background:#c8e6d9;
    color:#1e6f3f;
}

.vencido{
    background:#f5d1d1;
    color:#b32d2d;
}

.pendente{
    background:#fff3cd;
    color:#856404;
}
    .filters{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    display:flex;
    gap:15px;
    align-items:end;
    flex-wrap:wrap;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.filter-group{
    display:flex;
    flex-direction:column;
}

.filter-group label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    color:#8b7355;
    margin-bottom:5px;
}

.filter-group input,
.filter-group select{
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    min-width:220px;
}

.btn-limpar{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#d8d0c6;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">

    <h1>📋 Treinamentos · Colaborador</h1>

    ../index.html
    ← Voltar à lista
</a>
    </a>

</div>

<div id="resultado"></div>

<script>

fetch('../dados.json')

.then(response => response.json())

.then(dados => {

    const arquivo = window.location.pathname
    .split('/')
    .pop();

const idfixo = arquivo.split('_')[0];

const colaborador = dados.filter(
    x => x.IDFIXO === idfixo
);
    
const quantidadeTreinamentos = colaborador.length;
    
    const info = colaborador[0];

    let obrigatoriosHTML = "";
    let normativosHTML = "";

    let totalObrigatorios = 0;
   let totalNormativos = 0;
    
    let totalNoPrazo = 0;
let totalVencidos = 0;
let totalPendentes = 0;

    colaborador.forEach(item => {

        let classeStatus = "";

        if(item.STATUS === "NO PRAZO"){
    totalNoPrazo++;
}

else if(item.STATUS === "VENCIDO"){
    totalVencidos++;
}

else{
    totalPendentes++;
}
        
        if(item.STATUS === "NO PRAZO"){
            classeStatus = "ok";
        }

        else if(item.STATUS === "VENCIDO"){
            classeStatus = "vencido";
        }

        else{
            classeStatus = "pendente";
        }

        const linha = `
            <tr>
                <td>${item.TREINAMENTO}</td>
                <td>${item.TREINADO_EM}</td>
                <td>${item.VENCE_EM}</td>
                <td>
                    <span class="badge ${classeStatus}">
                        ${item.STATUS}
                    </span>
                </td>
            </tr>
        `;

        if(item.TIPO_TREINAMENTO === "NORM"){

    normativosHTML += linha;
    totalNormativos++;

} else {

    obrigatoriosHTML += linha;
    totalObrigatorios++;

}

    });

    document.getElementById("resultado").innerHTML = `

    <div class="card">

    <div class="info-grid">

        <div class="info-item">
            <span>Nome</span>
            <strong>${info.COLABORADOR_EXIBICAO}</strong>
            <div style="
    margin-top:8px;
    color:#8b7355;
    font-size:13px;
    font-weight:600;
">
    ${quantidadeTreinamentos} treinamentos encontrados
</div>
        </div>

        

        <div class="info-item">
            <span>Cargo</span>
            <strong>${info.CARGO}</strong>
        </div>

        <div class="info-item">
            <span>Área</span>
            <strong>${info.AREA}</strong>
        </div>

        <div class="info-item">
            <span>Coordenador</span>
            <strong>${info.COORDENADOR}</strong>
        </div>
        
        <div class="info-item">
    <span>Última Atualização</span>
    <strong>${info.ULTIMA_ATUALIZACAO_FORMATADA}</strong>
</div>

    </div>

</div>
<div class="card">

    <div class="info-grid">

        <div class="info-item">
            <span>Total</span>
            <strong>${quantidadeTreinamentos}</strong>
        </div>

        <div class="info-item">
            <span>No Prazo</span>
            <strong style="color:#1e6f3f">
                ${totalNoPrazo}
            </strong>
        </div>

        <div class="info-item">
            <span>Vencidos</span>
            <strong style="color:#b32d2d">
                ${totalVencidos}
            </strong>
        </div>

        <div class="info-item">
            <span>Pendentes</span>
            <strong style="color:#856404">
                ${totalPendentes}
            </strong>
        </div>

    </div>

</div>
</div>

<div class="filters">

    <div class="filter-group">

        <label>Buscar treinamento</label>

        <input
            type="text"
            id="filtroTreinamento"
            placeholder="Digite o treinamento..."
        >

    </div>

    <div class="filter-group">

        <label>Status</label>

        <select id="filtroStatus">

            <option value="">Todos</option>

            <option value="NO PRAZO">NO PRAZO</option>

            <option value="VENCIDO">VENCIDO</option>

            <option value="PENDENTE">PENDENTE</option>

        </select>

    </div>

    <button class="btn-limpar" id="btnLimpar">

        Limpar

    </button>

</div>

<div class="section">

    <div class="section">

        <h2>📚 Treinamentos Normativos (${totalNormativos})</h2>

        <table>

            <thead>

                <tr>

                    <th>Treinamento</th>
                    <th>Treinado em</th>
                    <th>Vence em</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                ${normativosHTML || `
<tr>
<td colspan="4"
style="
text-align:center;
padding:20px;
color:#8b7355;
font-style:italic;
">
Nenhum treinamento normativo encontrado.
</td>
</tr>
`}

            </tbody>

        </table>

    </div>

    <div class="section">

        <h2>📌 Treinamentos Obrigatórios (${totalObrigatorios})</h2>

        <table>

            <thead>

                <tr>

                    <th>Treinamento</th>
                    <th>Treinado em</th>
                    <th>Vence em</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                ${obrigatoriosHTML || `
<tr>
<td colspan="4"
style="
text-align:center;
padding:20px;
color:#8b7355;
font-style:italic;
">
Nenhum treinamento obrigatório encontrado.
</td>
</tr>
`}

            </tbody>

        </table>

    </div>

    `;
function aplicarFiltros() {

    const textoBusca =
        document.getElementById("filtroTreinamento")
        .value
        .toLowerCase();

    const statusSelecionado =
        document.getElementById("filtroStatus")
        .value;

    const linhas = document.querySelectorAll("tbody tr");

    linhas.forEach(linha => {

        const treinamento =
            linha.cells[0].innerText.toLowerCase();

        const status =
            linha.cells[3].innerText.trim();

        const atendeTreinamento =
            treinamento.includes(textoBusca);

        const atendeStatus =
            statusSelecionado === ""
            ||
            status === statusSelecionado;

        if(atendeTreinamento && atendeStatus){

            linha.style.display = "";

        }
        else{

            linha.style.display = "none";

        }

    });

}
    document
.getElementById("filtroTreinamento")
.addEventListener("input", aplicarFiltros);

document
.getElementById("filtroStatus")
.addEventListener("change", aplicarFiltros);

    document
.getElementById("btnLimpar")
.addEventListener("click", () => {

    document.getElementById("filtroTreinamento").value = "";

    document.getElementById("filtroStatus").value = "";

    aplicarFiltros();

});
});

</script>

</body>

</html>
