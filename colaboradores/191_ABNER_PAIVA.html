<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Teste JSON</title>
</head>

<body>

<h1>Teste SHE Nexus JSON</h1>

<div id="resultado"></div>

<script>

fetch('../dados.json')
.then(response => response.json())
.then(dados => {

    const colaborador = dados.filter(
    x => x.IDFIXO === "191"
);

const info = colaborador[0];
let treinamentosHTML = "";

colaborador.forEach(item => {

    treinamentosHTML += `
        <tr>
            <td>${item.TREINAMENTO}</td>
            <td>${item.TREINADO_EM}</td>
            <td>${item.VENCE_EM}</td>
            <td>${item.STATUS}</td>
        </tr>
    `;

});
document.getElementById("resultado").innerHTML = `

<h2>${info.COLABORADOR_EXIBICAO}</h2>

<p>
  <b>Cargo:</b> ${info.CARGO}
</p>

<p>
  <b>Área:</b> ${info.AREA}
</p>

<p>
  <b>Coordenador:</b> ${info.COORDENADOR}
</p>

<hr>

<h3>Treinamentos</h3>

<table border="1" cellpadding="5">

<thead>
<tr>
    <th>Treinamento</th>
    <th>Treinado em</th>
    <th>Vence em</th>
    <th>Status</th>
</tr>
</thead>

<tbody>

${treinamentosHTML}

</tbody>

</table>

`;

});

</script>

</body>

</html>
